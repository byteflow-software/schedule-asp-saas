services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: src/Scheduly.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=scheduly;Username=scheduly;Password=scheduly_pass
      - Jwt__Secret=SuperSecretKeyForDevelopment_MustBeAtLeast32Characters!
      - Jwt__Issuer=Scheduly
      - Jwt__Audience=Scheduly
      - Email__Host=mailhog
      - Email__Port=1025
      - Email__From=noreply@scheduly.com
      - Email__FromName=Scheduly
      - Email__EnableSsl=false
      - Coverage__Username=dev
      - Coverage__Password=dev123
    volumes:
      - ../src/Scheduly.Api/wwwroot/coverage:/app/wwwroot/coverage:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scheduly
      POSTGRES_USER: scheduly
      POSTGRES_PASSWORD: scheduly_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduly"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles:
      - with-redis

volumes:
  postgres_data:
